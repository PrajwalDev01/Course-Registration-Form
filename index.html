<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Registration Form</title>
  </head>
  <body>
    <h1>Course Registration Form Of The Institute</h1>

    <form>
      <!-- Personal Details -->
      <fieldset>
        <legend>Personal Details</legend>
        <table>
          <tr>
            <td><label for="fname">First Name:</label></td>
            <td>
              <input
                type="text"
                id="fname"
                placeholder="Ex: Prajwal"
                required
              />
            </td>
          </tr>
          <tr>
            <td><label for="sname">Surname:</label></td>
            <td><input type="text" id="sname" placeholder="" required /></td>
          </tr>
          <tr>
            <td><label for="mobile">Mobile Number:</label></td>
            <td>
              <input
                type="tel"
                id="mobile"
                placeholder="Ex: 987-897-0987"
                required
              />
            </td>
          </tr>
          <tr>
            <td><label for="email">Email:</label></td>
            <td>
              <input
                type="email"
                id="email"
                placeholder="Ex: xyz@gmail.com"
                required
              />
            </td>
          </tr>
          <tr>
            <td><label for="password">Password:</label></td>
            <td>
              <input
                type="password"
                id="password"
                placeholder="min 5 characters"
                required
                minlength="5"
              />
            </td>
          </tr>
          <tr>
            <td><label for="cpassword">Confirm Password:</label></td>
            <td>
              <input
                type="password"
                id="cpassword"
                placeholder="min 5 characters"
                required
                minlength="5"
              />
            </td>
          </tr>
          <tr>
            <td><label for="dob">DOB:</label></td>
            <td><input type="date" id="dob" required /></td>
          </tr>
          <tr>
            <td><label for="">Age</label></td>
            <td><input type="number" min="18" max="65" /></td>
          </tr>
          <tr>
            <td><label>Gender:</label></td>
            <td>
              <input type="radio" id="male" name="gender" value="Male" /><label
                for="male"
                >Male</label
              >
              <input
                type="radio"
                id="female"
                name="gender"
                value="Female"
              /><label for="female">Female</label>
              <input
                type="radio"
                id="custom"
                name="gender"
                value="Custom"
              /><label for="custom">Custom</label>
            </td>
          </tr>
          <tr>
            <td><label for="country">Select Country:</label></td>
            <td>
              <select id="country" name="country" required>
                <option value="">-- Select --</option>
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="China">China</option>
                <option value="Germany">Germany</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label for="picture">Upload Picture:</label></td>
            <td><input type="file" id="picture" /></td>
          </tr>
        </table>
      </fieldset>

      <!-- Course Details -->
      <fieldset>
        <legend>Course Details</legend>
        <table>
          <tr>
            <td><label for="course">Select Course:</label></td>
            <td>
              <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
                <option value="Web Development">Web Development</option>
                <option value="Data Science">Data Science</option>
              </select>
            </td>
          </tr>
          <tr>
            <td><label>Delivery Mode:</label></td>
            <td>
              <input
                type="checkbox"
                id="online"
                name="mode"
                value="Online"
              /><label for="online">ONLINE</label>
              <input
                type="checkbox"
                id="offline"
                name="mode"
                value="Offline"
              /><label for="offline">OFFLINE</label>
            </td>
          </tr>
          <tr>
            <td><label for="comments">Comments:</label></td>
            <td>
              <textarea
                id="comments"
                rows="3"
                placeholder="Enter any additional comments..."
              ></textarea>
            </td>
          </tr>
        </table>
      </fieldset>

      <button type="submit">Submit Form</button>
      <button type="reset">Reset Form</button>
    </form>
  </body>
</html>
